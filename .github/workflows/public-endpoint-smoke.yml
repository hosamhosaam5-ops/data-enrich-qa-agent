name: Public Worker API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check endpoint rejects unauthenticated requests
        env:
          API_URL: https://data-enrich-qa-agent.hosamhosaam5.workers.dev
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/no-key.json --write-out "%{http_code}" \
            --request POST "$API_URL" \
            --header "Content-Type: application/json" \
            --data '{"company_name":"Microsoft"}')
          echo "Unauthenticated HTTP status: $code"
          cat /tmp/no-key.json
          # 401 means the proxy secret was checked and rejected. 503 means the
          # secret is not configured; this also fails closed, but authenticated
          # smoke testing cannot pass until configuration is completed.
          test "$code" = "401" -o "$code" = "503"

      - name: Call Worker and validate JSON response
        env:
          API_URL: https://data-enrich-qa-agent.hosamhosaam5.workers.dev
          API_KEY: ${{ secrets.RAPIDAPI_PROXY_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$API_KEY" ]; then
            echo "::error::Add repository secret RAPIDAPI_PROXY_SECRET before running the authenticated test."
            exit 1
          fi

          code=$(curl --silent --show-error --output /tmp/response.json --write-out "%{http_code}" \
            --max-time 90 \
            --request POST "$API_URL" \
            --header "Content-Type: application/json" \
            --header "x-rapidapi-proxy-secret: $API_KEY" \
            --data '{"company_name":"Microsoft"}')

          echo "Authenticated HTTP status: $code"
          cat /tmp/response.json
          test "$code" = "200"

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/response.json", "utf8"));
            if (!body || body.success !== true || !body.data || typeof body.data !== "object") {
              console.error("Response is missing success/data object.");
              process.exit(1);
            }
            const required = ["company_name", "ceo_name", "ceo_email", "linkedin_url", "industry", "confidence", "verification_status", "data_source", "is_verified"];
            const missing = required.filter((key) => !(key in body.data));
            if (missing.length) {
              console.error("Missing response fields:", missing.join(", "));
              process.exit(1);
            }
            const allowedStatus = ["unverified_ai_generated", "source_attributed_unverified"];
            if (!allowedStatus.includes(body.data.verification_status) || body.data.is_verified !== false) {
              console.error("Response did not preserve the expected unverified-data labels.");
              process.exit(1);
            }
            if (body.data.verification_status === "source_attributed_unverified") {
              if (body.data.data_source !== "wikidata" || !Array.isArray(body.data.sources) || body.data.sources.length === 0 || !body.data.matched_entity?.id) {
                console.error("Source-attributed response is missing its entity/source evidence.");
                process.exit(1);
              }
            } else if (body.data.data_source !== "cloudflare_workers_ai" || !Array.isArray(body.data.sources) || body.data.sources.length !== 0) {
              console.error("AI fallback must be explicitly labeled and must not claim source attribution.");
              process.exit(1);
            }
            console.log("PASS: valid JSON and expected response schema.");
            console.log("Verification status:", body.data.verification_status);
            console.log("Data source:", body.data.data_source);
            console.log("is_verified:", body.data.is_verified);
          '
