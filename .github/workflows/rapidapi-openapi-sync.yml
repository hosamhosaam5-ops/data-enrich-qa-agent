name: Sync OpenAPI definition to RapidAPI

on:
  push:
    branches:
      - main
    paths:
      - openapi.yaml
      - .github/workflows/rapidapi-openapi-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-openapi:
    name: Upload OpenAPI spec to RapidAPI
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_API_KEY }}
      RAPIDAPI_API_ID: api_77330493-d01c-4f48-aefc-e7f1ab453c89
      RAPIDAPI_HOST: openapi-provisioning.p.rapidapi.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate expected EnrichIQ specification
        shell: bash
        run: |
          set -euo pipefail
          test -s openapi.yaml
          grep -q '^openapi: 3.0.2$' openapi.yaml
          grep -q '^  title: EnrichIQ$' openapi.yaml
          grep -q 'verification_status' openapi.yaml
          echo "PASS: OpenAPI file exists and contains the expected EnrichIQ metadata."

      - name: Upload specification to RapidAPI
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${RAPIDAPI_KEY}" ]; then
            echo "::error::Repository secret RAPIDAPI_API_KEY is missing."
            exit 1
          fi

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --max-time 90 \
            --request PUT "https://${RAPIDAPI_HOST}/v1/apis/${RAPIDAPI_API_ID}" \
            --header "x-rapidapi-host: ${RAPIDAPI_HOST}" \
            --header "x-rapidapi-key: ${RAPIDAPI_KEY}" \
            --form "file=@openapi.yaml;type=application/yaml")"

          echo "RapidAPI OpenAPI sync HTTP status: ${status}"
          if [[ "${status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "PASS: RapidAPI accepted the OpenAPI update."
            if [ -s "${response_file}" ]; then
              cat "${response_file}"
            fi
          else
            echo "::error::RapidAPI did not accept the OpenAPI update. Review the response below; no public visibility or pricing settings are changed by this workflow."
            cat "${response_file}"
            exit 1
          fi
