openapi: 3.0.2
info:
  title: EnrichIQ
  version: 1.0.0
  description: Turn company names into AI powered business insights with leadership details, contacts and industry data. Fast, simple and built for developers and AI agents. Results are unverified and may be inaccurate.
  termsOfService: https://github.com/hosamhosaam5-ops/data-enrich-qa-agent/blob/main/docs/terms-of-service.md
  x-long-description: >
    EnrichIQ turns company names into AI powered business insights for developers and AI agents.
    It may return leadership information, public business contact details, LinkedIn URLs,
    and industry fields. Unknown fields may be null. The service uses an AI model without
    live web research or independent source verification. Results may be incomplete,
    outdated, or incorrect. Every response remains marked unverified and must be checked
    independently before use in consequential workflows.
  x-category: Data
  x-website: https://github.com/hosamhosaam5-ops/data-enrich-qa-agent
servers:
  - url: https://data-enrich-qa-agent.hosamhosaam5.workers.dev
    description: Current Cloudflare Worker origin (for provider testing only)
paths:
  /:
    post:
      operationId: enrichCompany
      summary: Enrich a company name with AI-generated fields
      description: >
        Provide a company name. The service may return CEO, public contact, LinkedIn,
        and industry fields when the model can provide them, otherwise null.
        All returned data is explicitly unverified. RapidAPI automatically injects
        its API-specific X-RapidAPI-Proxy-Secret header from Firewall Settings.
        The Worker validates this header against a Cloudflare Worker Secret; do not
        expose the secret value to API consumers.
      security:
        - RapidAPIKey: []
          RapidAPIHost: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrichmentRequest'
            example:
              company_name: Microsoft
      responses:
        '200':
          description: Enrichment completed; values are AI-generated and unverified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentSuccess'
              example:
                success: true
                data:
                  company_name: Microsoft
                  ceo_name: null
                  ceo_email: null
                  linkedin_url: null
                  industry: Technology
                  confidence: low
                  verification_status: unverified_ai_generated
                  data_source: cloudflare_workers_ai
                  is_verified: false
        '400':
          description: Missing or invalid company_name or invalid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Request not authorized by RapidAPI origin secret validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Only POST is supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Content-Type must be application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The AI model returned invalid output.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Workers AI or origin authentication is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    RapidAPIKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: Automatically supplied by RapidAPI for subscriber authentication.
    RapidAPIHost:
      type: apiKey
      in: header
      name: X-RapidAPI-Host
      description: Automatically supplied by RapidAPI for subscriber routing.
  schemas:
    EnrichmentRequest:
      type: object
      required:
        - company_name
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Company name to enrich.
          example: Microsoft
      additionalProperties: false
    EnrichmentSuccess:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required:
            - company_name
            - ceo_name
            - ceo_email
            - linkedin_url
            - industry
            - confidence
            - verification_status
            - data_source
            - is_verified
          properties:
            company_name:
              type: string
            ceo_name:
              type: string
              nullable: true
            ceo_email:
              type: string
              format: email
              nullable: true
            linkedin_url:
              type: string
              format: uri
              nullable: true
            industry:
              type: string
              nullable: true
            confidence:
              type: string
              enum: [low, medium, high]
            verification_status:
              type: string
              enum: [unverified_ai_generated]
            data_source:
              type: string
              enum: [cloudflare_workers_ai]
            is_verified:
              type: boolean
              enum: [false]
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
        error:
          type: string
        details:
          type: string
